name: renovate-trivy
description: Scan the container images Renovate tracks across your repositories with Trivy and feed the CVE findings back to Renovate through one preset
branding:
  icon: shield
  color: blue

inputs:
  step:
    description: "`lookup` (Renovate, read-only, on each repository), `scan` (Trivy) or `publish` (validate and push to the data branch). Run them as three jobs and pass `runner.temp/renovate-trivy` between them as an artifact."
    required: true
  repositories:
    description: "`lookup`: space- or newline-separated `owner/name` list of the repositories to scan."
    default: ""
  read-token:
    description: "`lookup`: token that can clone the repositories. Not needed for public ones."
    default: ""
  data-repository:
    description: "`owner/name` of the repository holding the data branch. Defaults to the repository running the workflow."
    default: ${{ github.repository }}
  data-branch:
    description: Branch that receives the preset, the reports and the SBOM archive.
    default: data
  data-token:
    description: "`scan` reads the data branch with it, `publish` pushes with it (needs `contents: write`)."
    default: ${{ github.token }}
  skip-registries:
    description: "`lookup`: space-separated registry hosts not to scan (unreachable from the runner)."
    default: ""
  label:
    description: "`scan`: label Renovate adds to PRs that fix critical/high CVEs."
    default: security
  release:
    description: "`scan`: release fixing updates from each repository's Renovate schedule."
    default: "true"
  dashboard-report:
    description: "`scan`: put a CVE summary at the top of each Dependency Dashboard."
    default: "true"
  renovate-version:
    description: "`lookup`: Renovate npm version. Defaults to the version pinned in this action."
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Lookup
      if: inputs.step == 'lookup'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        SKIP_REGISTRIES: ${{ inputs.skip-registries }}
        RENOVATE_VERSION: ${{ inputs.renovate-version }}
        RENOVATE_TRIVY_READ_TOKEN: ${{ inputs.read-token }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        args=(--repositories "$REPOSITORIES" --out "$RUNNER_TEMP/renovate-trivy/targets.json")
        for registry in $SKIP_REGISTRIES; do args+=(--skip-registry "$registry"); done
        [ -z "$RENOVATE_VERSION" ] || args+=(--renovate-version "$RENOVATE_VERSION")
        node src/cli.ts lookup "${args[@]}"

    - if: inputs.step == 'scan'
      uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
      with:
        working_directory: ${{ github.action_path }}
        install_args: trivy
        cache_key_prefix: renovate-trivy

    - name: Scan
      if: inputs.step == 'scan'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DATA_REPOSITORY: ${{ inputs.data-repository }}
        DATA_BRANCH: ${{ inputs.data-branch }}
        RENOVATE_TRIVY_DATA_TOKEN: ${{ inputs.data-token }}
        LABEL: ${{ inputs.label }}
        RELEASE: ${{ inputs.release }}
        DASHBOARD_REPORT: ${{ inputs.dashboard-report }}
      run: |
        dir="$RUNNER_TEMP/renovate-trivy"
        args=(--targets "$dir/targets.json" --out "$dir/delta" --label "$LABEL"
              --data-remote "$GITHUB_SERVER_URL/$DATA_REPOSITORY.git" --data-branch "$DATA_BRANCH"
              --web-url "$GITHUB_SERVER_URL/$DATA_REPOSITORY/blob/$DATA_BRANCH")
        [ "$RELEASE" = "true" ] || args+=(--no-release)
        [ "$DASHBOARD_REPORT" = "true" ] || args+=(--no-dashboard-report)
        mise exec -- node src/cli.ts scan "${args[@]}"

    - name: Publish
      if: inputs.step == 'publish'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        DATA_REPOSITORY: ${{ inputs.data-repository }}
        DATA_BRANCH: ${{ inputs.data-branch }}
        RENOVATE_TRIVY_DATA_TOKEN: ${{ inputs.data-token }}
      run: |
        node src/cli.ts publish --delta "$RUNNER_TEMP/renovate-trivy/delta" --branch "$DATA_BRANCH" \
          --remote "$GITHUB_SERVER_URL/$DATA_REPOSITORY.git" \
          --web-url "$GITHUB_SERVER_URL/$DATA_REPOSITORY/blob/$DATA_BRANCH"
